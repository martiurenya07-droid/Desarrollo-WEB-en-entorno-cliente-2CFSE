<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 3 - Cuenta atrás</title>
</head>
<body>
    <h1>Práctica 3 - Cuenta atrás</h1>
    <p><a href="../index.html">Volver al inicio</a></p>
    <p id="primera">6</p>
    <p id="segunda">60</p>

    <!-- En esta práctica el profesor pide importar el módulo desde el HTML. -->
    <script type="module">
        import { cuenta, temporizador } from "./temporizador.js";

        const primera = document.getElementById("primera");
        const segunda = document.getElementById("segunda");

        // Las dos cuentas empiezan a la vez.
        cuenta(6, primera, 1000);
        cuenta(60, segunda, 100, function () {
            segunda.textContent = "Fin";
        });

        // temporizador también está exportado, como se pide en el enunciado.
    </script>
</body>
</html>
